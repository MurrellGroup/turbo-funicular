<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WSFMDock</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <section id="viewport" aria-label="Molecular inference viewport"></section>
      <header>
        <div>
          <p class="eyebrow">WSFMDock</p>
          <h1>Interactive docking</h1>
        </div>
        <div class="device-state">
          <span id="device-dot"></span>
          <span id="device-label">Initializing WebGPU</span>
        </div>
      </header>
      <aside class="controls">
        <div class="source-tabs" role="tablist" aria-label="Input source">
          <button id="example-tab" class="active" type="button" role="tab" aria-selected="true">Examples</button>
          <button id="custom-tab" type="button" role="tab" aria-selected="false">Custom PDB</button>
        </div>
        <section id="example-panel" class="source-panel" role="tabpanel">
          <label>
            Pocket
            <select id="sample-select" disabled></select>
          </label>
        </section>
        <section id="custom-panel" class="source-panel" role="tabpanel" hidden>
          <input id="pdb-input" type="file" accept=".pdb,.ent,.cif,.mmcif,chemical/x-pdb" hidden />
          <div class="pdb-id-row">
            <label>
              PDB ID
              <input id="pdb-id-input" type="text" value="1HVR" maxlength="4" spellcheck="false" autocomplete="off" />
            </label>
            <button id="fetch-pdb" class="secondary source-command" type="button" disabled>Load</button>
          </div>
          <button id="open-pdb" class="secondary source-command" type="button" disabled>Open PDB</button>
          <fieldset class="structure-choices"><legend>Protein chains</legend><div class="choice-actions"><button id="chains-all" type="button">All</button><button id="chains-none" type="button">None</button></div><div id="chain-list"></div></fieldset>
          <fieldset class="structure-choices"><legend>Ligands</legend><div class="choice-actions"><button id="ligands-all" type="button">All</button><button id="ligands-none" type="button">None</button></div><div id="ligand-list"></div></fieldset>
          <p id="selection-count" class="structure-label">No structure loaded</p>
          <button id="prepare-selection" type="button" disabled>Use selection</button>
          <button id="edit-sequence" class="secondary" type="button" disabled>Sequence</button>
          <label>Active ligand<select id="active-ligand" disabled></select></label>
          <button id="remove-ligand" class="secondary" type="button" disabled>Remove ligand</button>
          <label>
            Replacement SMILES
            <input id="smiles-input" type="text" value="CC(=O)Oc1ccccc1C(=O)O" spellcheck="false" autocomplete="off" />
          </label>
          <button id="replace-ligand" class="secondary source-command" type="button" disabled>Replace ligand</button>
          <p id="structure-label" class="structure-label">No custom structure loaded</p>
        </section>
        <div class="field-row">
          <label>
            Steps
            <select id="step-select">
              <option value="4">4</option>
              <option value="8" selected>8</option>
              <option value="16">16</option>
            </select>
          </label>
          <label>
            Seed
            <input id="seed-input" type="number" value="20260902" min="1" step="1" />
          </label>
        </div>
        <button id="run-button" type="button" disabled>
          <span id="run-icon">&#9654;</span>
          <span id="run-label">Run inference</span>
        </button>
        <div class="field-row campaign-start">
          <label>Samples<input id="campaign-count" type="number" value="8" min="1" max="200" step="1" /></label>
          <button id="run-campaign" type="button" disabled>Run campaign</button>
        </div>
        <label class="toggle-row"><input id="mpnn-enable" type="checkbox" disabled /><span>ProteinMPNN proposals</span></label>
        <section id="mpnn-options" hidden>
          <label>MPNN model<select id="mpnn-model"></select></label>
          <div class="field-row">
            <label>Temperature<input id="mpnn-temperature" type="number" min="0.001" step="0.05" value="0.1" /></label>
            <label>Backbone noise (A)<input id="mpnn-noise" type="number" min="0" step="0.01" value="0" /></label>
          </div>
          <label class="toggle-row"><input id="mpnn-fresh-noise" type="checkbox" /><span>Fresh noise per sequence</span></label>
          <details><summary>MPNN options</summary>
            <label>Execution<select id="mpnn-backend"><option value="auto">Auto</option><option value="wasm">WASM</option><option value="webgpu">WebGPU</option></select></label>
            <div class="field-row">
              <label>Threads<input id="mpnn-threads" type="number" min="1" step="1" value="1" /></label>
              <label>Sequence batch<input id="mpnn-batch" type="number" min="1" max="16" step="1" value="1" /></label>
            </div>
            <label>Omit amino acids<input id="mpnn-omit" type="text" value="X" spellcheck="false" /></label>
            <label>Constraints (JSON)<textarea id="mpnn-constraints" rows="4" spellcheck="false">{}</textarea></label>
            <div class="mpnn-file-actions">
              <input id="mpnn-constraint-file" type="file" accept=".json" hidden />
              <button id="mpnn-open-constraints" type="button" class="secondary icon-button" title="Upload constraints" aria-label="Upload constraints"><i data-lucide="upload"></i></button>
              <button id="mpnn-map" type="button" class="secondary icon-button" title="Download residue map" aria-label="Download residue map"><i data-lucide="download"></i></button>
            </div>
          </details>
          <p id="mpnn-context" class="structure-label"></p>
          <button id="mpnn-suggest" type="button" class="secondary" disabled>Suggest X residues</button>
          <p id="mpnn-status" class="structure-label" role="status"></p>
        </section>
        <button id="stop-campaign" class="secondary" type="button" hidden>Stop</button>
        <section id="campaign-results" hidden>
          <div class="campaign-navigation">
            <button id="previous-result" class="secondary icon-button" title="Previous sample" aria-label="Previous sample"><i data-lucide="chevron-left"></i></button>
            <select id="campaign-result" aria-label="Campaign sample"></select>
            <button id="next-result" class="secondary icon-button" title="Next sample" aria-label="Next sample"><i data-lucide="chevron-right"></i></button>
            <button id="download-result" class="secondary icon-button" title="Download sample" aria-label="Download sample"><i data-lucide="download"></i></button>
          </div>
          <p id="result-identities" class="structure-label"></p>
        </section>
        <button id="reset-camera" class="secondary" type="button" disabled>Reset view</button>
        <label class="toggle-row">
          <input id="show-reference" type="checkbox" />
          <span>Reference pose</span>
        </label>
        <dl class="metrics">
          <div><dt>Model</dt><dd id="model-label">Loading manifest</dd></div>
          <div><dt>Atoms</dt><dd id="atom-count">-</dd></div>
          <div><dt>Step</dt><dd id="step-status">-</dd></div>
          <div><dt>Last map</dt><dd id="map-time">-</dd></div>
          <div><dt>Total</dt><dd id="total-time">-</dd></div>
          <div><dt>GPU memory</dt><dd id="memory-label">-</dd></div>
        </dl>
        <div class="progress"><span id="progress-bar"></span></div>
        <p id="status" role="status">Requesting a WebGPU adapter.</p>
      </aside>
      <section id="sequence-panel" aria-label="Protein sequence editor" hidden>
        <div class="sequence-toolbar">
          <label>Chain<select id="sequence-chain"></select></label>
          <span id="selected-residues"></span>
          <button id="close-sequence" class="secondary icon-button" title="Close sequence" aria-label="Close sequence"><i data-lucide="x"></i></button>
        </div>
        <div class="sequence-import">
          <textarea id="sequence-input" aria-label="Amino-acid sequence" spellcheck="false" rows="2"></textarea>
          <input id="sequence-file" type="file" accept=".fasta,.fa,.faa,.fas,.txt" hidden />
          <button id="open-sequence" class="secondary icon-button" title="Upload sequence" aria-label="Upload sequence"><i data-lucide="upload"></i></button>
          <button id="align-sequence" type="button">Align</button>
          <select id="sequence-record" aria-label="Uploaded sequence"></select>
        </div>
        <p id="alignment-status" role="status"></p>
        <div id="sequence-grid" aria-label="Sequence alignment"></div>
        <div class="sequence-actions">
          <button id="swap-selected" type="button" disabled>Swap selected</button>
          <select id="residue-identity" aria-label="Residue identity"></select>
          <button id="set-identity" type="button" disabled>Set identity</button>
          <button id="clear-edits" class="secondary" type="button" disabled>Clear edits</button>
        </div>
        <p id="mutation-list"></p>
      </section>
      <div class="legend" aria-label="Atom role legend">
        <span><i class="protein"></i>Protein</span>
        <span><i class="sidechain"></i>Moving side chain</span>
        <span><i class="ligand"></i>Ligand</span>
      </div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
